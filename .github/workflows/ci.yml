name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile media_studio.py
      - name: Validate plugin manifest
        run: python -c "import json; json.load(open('plugin.json', encoding='utf-8'))"
      - name: Validate shell launcher
        run: sh -n start.sh
      - name: Reject runtime data
        run: |
          ! find . \( -path ./.git -o -path ./docs \) -prune -o -type f \
            \( -name 'studio-config.json' -o -name 'studio-jobs.json' \
            -o -name 'studio-tags.json' -o -name 'studio-favorites.json' \
            -o -name '*.log' -o -name '*.mp4' -o -name '*.png' \
            -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) -print | grep -q .
      - name: Reject local paths and obvious secrets
        run: |
          if grep -RInE 'C:\\\\Users\\\\|庞皓文|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9_-]{20,}' \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=docs . ; then
            echo "Potential local path or secret found"; exit 1;
          fi
